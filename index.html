<body>
<title>Menthe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F4F7F2; --surface:#FFFFFF; --surface-2:#EDF3EA; --surface-3:#E3EBDF;
  --ink:#15271E; --ink-2:#4B5D53; --ink-3:#7C8C83;
  --line:#DCE5D8; --line-strong:#C6D3C1;
  --brand:#0A7A52; --brand-deep:#0A3D2B; --brand-soft:#DCEFE4;
  --rose:#E97BA4; --rose-soft:#FCE6EE; --rose-deep:#9D3F64;
  --or:#B9891C; --or-soft:#FAEFDA;
  --ep1:#7A5A0E; --ep2:#A2780F; --ep3:#B9891C; --ep4:#CFA03C; --ep5:#DCB86A;
  --shadow:0 1px 2px rgba(21,39,30,.05), 0 8px 24px -12px rgba(21,39,30,.18);
  --shadow-lift:0 2px 4px rgba(21,39,30,.07), 0 18px 40px -16px rgba(21,39,30,.28);
  --r:16px; --r-lg:22px;
  --disp:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1512; --surface:#18211C; --surface-2:#1F2A23; --surface-3:#26332B;
    --ink:#E9F1EB; --ink-2:#A6B8AC; --ink-3:#76887D;
    --line:#293630; --line-strong:#37483F;
    --brand:#1FA470; --brand-deep:#8FD9BC; --brand-soft:#14332628;
    --rose:#EC90B2; --rose-soft:#33202800; --rose-deep:#F3B4CB;
    --or:#CF9A33; --or-soft:#2A201400;
    --ep1:#F0DCA8; --ep2:#E2C176; --ep3:#CF9A33; --ep4:#AC7C22; --ep5:#8A6118;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-lift:0 2px 6px rgba(0,0,0,.5), 0 18px 40px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1512; --surface:#18211C; --surface-2:#1F2A23; --surface-3:#26332B;
  --ink:#E9F1EB; --ink-2:#A6B8AC; --ink-3:#76887D;
  --line:#293630; --line-strong:#37483F;
  --brand:#1FA470; --brand-deep:#8FD9BC; --brand-soft:#14332628;
  --rose:#EC90B2; --rose-soft:#33202800; --rose-deep:#F3B4CB;
  --or:#CF9A33; --or-soft:#2A201400;
  --ep1:#F0DCA8; --ep2:#E2C176; --ep3:#CF9A33; --ep4:#AC7C22; --ep5:#8A6118;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lift:0 2px 6px rgba(0,0,0,.5), 0 18px 40px -16px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}

.app{max-width:460px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
  background:var(--bg);position:relative}
.scroll{flex:1;overflow-y:auto;padding:0 16px 128px;-webkit-overflow-scrolling:touch}

/* ---------- topbar ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--bg);
  padding:14px 16px 10px;display:flex;align-items:center;gap:10px}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-20px;height:20px;
  background:linear-gradient(var(--bg),transparent);pointer-events:none}
.brandmark{display:flex;align-items:center;gap:7px;margin-right:auto;min-width:0}
.brandmark b{font-family:var(--disp);font-weight:800;font-size:19px;letter-spacing:-.02em}
.leafmark{width:22px;height:22px;flex:none}
.mnav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.mnav button{width:30px;height:30px;border-radius:999px;color:var(--ink-2);display:grid;place-items:center;font-size:16px}
.mnav button:hover{background:var(--surface-2)}
.mnav button:disabled{opacity:.28;cursor:default}
.mnav .lbl{font-weight:600;font-size:13.5px;padding:0 8px;min-width:104px;text-align:center;
  text-transform:capitalize;white-space:nowrap}

/* ---------- generic ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:18px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
h2.sec{font-family:var(--disp);font-size:15px;font-weight:700;margin:22px 0 0;letter-spacing:-.01em}

/* ---------- hero ---------- */
.hero{background:linear-gradient(163deg,var(--brand) 0%,var(--brand-deep) 100%);
  border-radius:26px;padding:20px 20px 18px;color:#F2FBF6;position:relative;overflow:hidden;
  box-shadow:var(--shadow-lift)}
.hero .rings{position:absolute;right:-46px;top:-56px;width:190px;height:190px;opacity:.16;pointer-events:none}
.hero .lab{font-size:12.5px;font-weight:600;opacity:.8;letter-spacing:.01em}
.hero .big{font-family:var(--disp);font-weight:800;font-size:clamp(42px,13vw,54px);line-height:1;
  letter-spacing:-.035em;margin:7px 0 0;display:block}
.hero .sub{font-size:12.5px;opacity:.78;margin-top:9px;line-height:1.45}
.hero .revbtn{margin-top:14px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  background:rgba(255,255,255,.15);padding:7px 12px;border-radius:999px;color:#F2FBF6}
.hero .revbtn:hover{background:rgba(255,255,255,.24)}

/* ---------- gauges ---------- */
.gauges{display:flex;flex-direction:column;gap:2px}
.gauge{padding:15px 4px 14px}
.gauge + .gauge{border-top:1px solid var(--line)}
.g-top{display:flex;align-items:baseline;gap:9px}
.g-dot{width:10px;height:10px;border-radius:3px;flex:none;align-self:center}
.g-name{font-weight:700;font-size:14.5px;letter-spacing:-.01em}
.g-amt{margin-left:auto;font-family:var(--disp);font-weight:700;font-size:18px;letter-spacing:-.02em}
.g-track{position:relative;height:11px;border-radius:99px;background:var(--surface-3);margin:11px 0 8px;overflow:visible}
.g-fill{position:absolute;inset:0 auto 0 0;border-radius:99px;transition:width .5s cubic-bezier(.3,1,.4,1)}
.g-tick{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:2px;background:var(--surface);
  box-shadow:0 0 0 1.5px var(--line-strong)}
.g-over{position:absolute;top:0;bottom:0;right:-1px;width:14px;border-radius:0 99px 99px 0;
  background:repeating-linear-gradient(115deg,currentColor 0 3px,transparent 3px 6px);opacity:.5}
.g-bot{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);font-weight:600}
.g-ref{font-size:11.5px;color:var(--ink-3);font-weight:500;margin-top:5px}
.chip{margin-left:auto;font-size:11px;font-weight:600;padding:3.5px 9px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.good{color:var(--brand);border-color:color-mix(in srgb,var(--brand) 26%,transparent);
  background:color-mix(in srgb,var(--brand) 9%,transparent)}
.chip.over{color:var(--or);border-color:color-mix(in srgb,var(--or) 30%,transparent);
  background:color-mix(in srgb,var(--or) 10%,transparent)}

/* ---------- épargne ---------- */
.epbar{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--surface-3);gap:2px}
.epbar i{display:block;height:100%}
.epbar i:first-child{border-radius:99px 0 0 99px}
.epbar i:last-child{border-radius:0 99px 99px 0}
.epbar i:only-child{border-radius:99px}
.pot{display:flex;align-items:center;gap:10px;padding:12px 0}
.pot + .pot{border-top:1px solid var(--line)}
.pot .sw{width:10px;height:10px;border-radius:3px;flex:none}
.pot .em{font-size:17px;flex:none}
.pot .m{flex:1;min-width:0}
.pot .m b{display:block;font-size:13.5px;font-weight:600;letter-spacing:-.005em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pot .m span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.pot .a{text-align:right;flex:none}
.pot .a b{display:block;font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pot .a span{display:block;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;margin-top:2px}
.goal{margin-top:9px}
.goal .gt{height:7px;border-radius:99px;background:var(--surface-3);overflow:hidden}

<script>
(function(){
"use strict";

/* ============================================================
   Modèle
   ============================================================ */
var KEY = "menthe.v1";
var GROUPS = {
  essentiel:{ nom:"Essentiel", color:"var(--brand)", desc:"Ce qui doit être payé" },
  plaisir:  { nom:"Plaisir",   color:"var(--rose)",  desc:"Ce qui te fait plaisir" },
  epargne:  { nom:"Épargne",   color:"var(--or)",    desc:"Ce que tu mets de côté" }
};
var GORDER = ["essentiel","plaisir","epargne"];

var DEFAULT_CATS = [
  ["Loyer","🏠","essentiel"],["Courses","🛒","essentiel"],["Énergie","💡","essentiel"],
  ["Téléphone / Internet","📱","essentiel"],["Transport","🚌","essentiel"],
  ["Santé","💊","essentiel"],["Assurances","🛡️","essentiel"],
  ["Restos & sorties","🍜","plaisir"],["Shopping","👗","plaisir"],["Beauté","💅","plaisir"],
  ["Abonnements","🎧","plaisir"],["Sport","🏃","plaisir"],["Voyages","✈️","plaisir"],
  ["Cadeaux","🎁","plaisir"],["Divers","✨","plaisir"],
  ["Vacances","🏖️","epargne"],["Fonds d'urgence","🛟","epargne"],["Projet immobilier","🏡","epargne"]
];
var POTS_DEFAUT = [["Vacances","🏖️"],["Fonds d'urgence","🛟"],["Projet immobilier","🏡"]];

var state = null;

function freshState(){
  return {
    v:1, onboarded:false, jourDebut:1,
    revenu:0, revenuMois:{},
    cibles:{essentiel:50, plaisir:30, epargne:20},
    cats: DEFAULT_CATS.map(function(c,i){ return {id:"c"+i, nom:c[0], em:c[1], gr:c[2]}; }),
    recur: [],
    tx: [],
    recurFait: {}
  };
}
function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(!raw) return freshState();
    var s = JSON.parse(raw);
    var f = freshState();
    for(var k in f) if(!(k in s)) s[k] = f[k];
    return migrer(s);
  }catch(e){ return freshState(); }
}

/* Les anciennes poches génériques laissent la place aux trois poches nommées,
   mais seulement si elles n'ont jamais servi — on n'efface aucune saisie. */
function migrer(s){
  if(s.mig2) return s;
  var utilisee = function(id){
    for(var i=0;i<s.tx.length;i++) if(s.tx[i].cat === id) return true;
    for(var j=0;j<s.recur.length;j++) if(s.recur[j].cat === id) return true;
    return false;
  };
  s.cats = s.cats.filter(function(c){
    return !(c.gr === "epargne" && (c.nom === "Épargne" || c.nom === "Projet") && !utilisee(c.id));
  });
  var noms = s.cats.filter(function(c){ return c.gr === "epargne"; }).map(function(c){ return c.nom; });
  POTS_DEFAUT.forEach(function(p){
    if(noms.indexOf(p[0]) === -1) s.cats.push({id:uid(), nom:p[0], em:p[1], gr:"epargne"});
  });
  s.mig2 = true;
  return s;
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ toast("Impossible d'enregistrer sur cet appareil"); }
}

/* ============================================================
   Utilitaires
   ============================================================ */
var MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août",
            "septembre","octobre","novembre","décembre"];
var JOURS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];

function pad2(n){ return n<10 ? "0"+n : ""+n; }
function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
/* Le mois budgétaire ne commence pas forcément le 1er. Si Justine est payée le 26,
   tout ce qui est daté du 26 appartient déjà au mois suivant. Toute l'app passe par
   cette fonction, donc il suffit de la décaler ici. */
function monthKey(iso){
  var mk = iso.slice(0,7);
  var jd = (state && state.jourDebut) || 1;
  if(jd > 1 && +iso.slice(8,10) >= jd) mk = shiftMonth(mk, 1);
  return mk;
}
function curMonthKey(){ return monthKey(todayISO()); }
function jourDebut(){ return (state && state.jourDebut) || 1; }
/* Premier et dernier jour réels du cycle affiché */
function debutCycle(mk){
  var jd = jourDebut();
  if(jd <= 1) return mk+"-01";
  return shiftMonth(mk,-1)+"-"+pad2(jd);
}
function finCycle(mk){
  var jd = jourDebut();
  if(jd <= 1) return mk+"-"+pad2(daysInMonth(mk));
  return mk+"-"+pad2(jd-1);
}
var MOIS_COURT = ["janv.","févr.","mars","avril","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
function dateCourte(iso){ return (+iso.slice(8,10))+" "+MOIS_COURT[+iso.slice(5,7)-1]; }
function mkLabel(mk){ var p=mk.split("-"); return MOIS[+p[1]-1]+" "+p[0]; }
function shiftMonth(mk,d){
  var p=mk.split("-"), y=+p[0], m=+p[1]-1+d;
  y += Math.floor(m/12); m = ((m%12)+12)%12;
  return y+"-"+pad2(m+1);
}
function eur(n){
  var r = Math.round(n);
  return r.toLocaleString("fr-FR").replace(/ | /g," ")+" €";
}
function eur2(n){
  return (Math.round(n*100)/100).toLocaleString("fr-FR",{minimumFractionDigits:0,maximumFractionDigits:2})
    .replace(/ | /g," ")+" €";
}
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function uid(){ return "x"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function catById(id){
  for(var i=0;i<state.cats.length;i++) if(state.cats[i].id===id) return state.cats[i];
  return null;
}
function daysInMonth(mk){ var p=mk.split("-"); return new Date(+p[0], +p[1], 0).getDate(); }

/* ============================================================
   Calculs
   ============================================================ */
function revenuDe(mk){
  if(state.revenuMois && state.revenuMois[mk] != null) return state.revenuMois[mk];
  return state.revenu || 0;
}
function bilan(mk){
  var b = {essentiel:0, plaisir:0, epargne:0, bonus:0, n:0};
  state.tx.forEach(function(t){
    if(monthKey(t.date) !== mk) return;
    b.n++;
    if(t.type === "revenu"){ b.bonus += t.montant; return; }
    var c = catById(t.cat);
    if(c) b[c.gr] += t.montant;
  });
  b.revenu = revenuDe(mk) + b.bonus;
  b.sorties = b.essentiel + b.plaisir + b.epargne;
  b.reste = b.revenu - b.sorties;
  return b;
}

/* ---------- avances à se faire rembourser ---------- */
/* Une dépense marquée « à me faire rembourser » reste comptée en entier le mois où elle
   est payée : l'argent est bien sorti. Chaque remboursement crée une ligne NÉGATIVE dans
   la même catégorie, datée du jour où l'argent revient — jamais une « rentrée », sinon le
   revenu du mois gonflerait et décalerait tous les repères 50/30/20. */
function avances(){
  var out = [];
  state.tx.forEach(function(t){
    if(!t.rb || t.type === "revenu") return;
    var recu = 0, lignes = [];
    state.tx.forEach(function(r){
      if(r.rbDe === t.id){ recu += -r.montant; lignes.push(r); }
    });
    var c = catById(t.cat);
    out.push({
      t:t, cat:c, paye:t.montant, recu:recu,
      reste: Math.max(0, t.montant - recu),
      solde: t.montant - recu,
      lignes: lignes,
      fini: recu >= t.montant - 0.005
    });
  });
  out.sort(function(a,b){
    if(a.fini !== b.fini) return a.fini ? 1 : -1;
    return a.t.date < b.t.date ? 1 : -1;
  });
  return out;
}
function totauxAvances(){
  var a = avances(), s = {paye:0, recu:0, attente:0, n:0, nAttente:0};
  a.forEach(function(x){
    s.paye += x.paye; s.recu += x.recu; s.n++;
    if(!x.fini){ s.attente += x.reste; s.nAttente++; }
  });
  s.charge = s.paye - s.recu;
  return s;
}

/* ---------- épargne : poches, cumuls, objectifs ---------- */
function poches(){
  return state.cats.filter(function(c){ return c.gr === "epargne"; });
}
/* Étale les poches sur toute la rampe : avec 3 poches on prend les pas 1, 3 et 5,
   pas 1, 2, 3 — sinon les segments voisins sont indistinguables. */
function potColor(i, n){
  if(!n || n < 2) return "var(--ep3)";
  if(n >= 5) return "var(--ep"+((i % 5) + 1)+")";
  var pas = [null, [3], [1,5], [1,3,5], [1,3,4,5]][n];
  return "var(--ep"+pas[i % pas.length]+")";
}

/* mode "mois" = le mois affiché ; mode "annee" = année civile du mois affiché */
function periode(mode){
  if(mode === "annee"){
    var an = String(epAnnee || curMK.slice(0,4));
    return {de:an+"-01", a:an+"-12", an:an};
  }
  return {de:curMK, a:curMK, an:curMK.slice(0,4)};
}
/* Bornes du sélecteur d'année : de la première saisie à l'année en cours */
function bornesAnnees(){
  var max = +curMonthKey().slice(0,4), min = max;
  state.tx.forEach(function(t){
    var a = +monthKey(t.date).slice(0,4);
    if(a < min) min = a;
  });
  return {min:min, max:max};
}
function sommePoche(catId, p){
  var t = 0;
  state.tx.forEach(function(x){
    if(x.type === "revenu" || x.cat !== catId) return;
    var mk = monthKey(x.date);
    if(mk >= p.de && mk <= p.a) t += x.montant;
  });
  return t;
}
/* Cumul d'une poche = ce qu'elle avait déjà en banque avant l'app + tous les
   versements saisis depuis. Le solde de départ n'entre JAMAIS dans sommePoche() :
   sinon il serait compté comme une épargne du mois en cours et fausserait les
   jauges 50/30/20 et le « reste à répartir ». */
function cumulPoche(catId){
  var c = catById(catId);
  var t = (c && c.solde) || 0;
  state.tx.forEach(function(x){ if(x.type !== "revenu" && x.cat === catId) t += x.montant; });
  return t;
}
/* nombre de mois réellement alimentés sur la période — pour ne pas
   présenter une moyenne annuelle bâtie sur deux mois de données */
function moisAvecDonnees(p){
  var vus = {};
  state.tx.forEach(function(x){
    var mk = monthKey(x.date);
    if(mk >= p.de && mk <= p.a) vus[mk] = 1;
  });
  return Object.keys(vus).length;
}
/* repère du fonds d'urgence : 3 à 6 mois de dépenses essentielles observées */
function moyenneEssentiel(){
  var parMois = {};
  state.tx.forEach(function(x){
    if(x.type === "revenu") return;
    var c = catById(x.cat);
    if(!c || c.gr !== "essentiel") return;
    var mk = monthKey(x.date);
    parMois[mk] = (parMois[mk] || 0) + x.montant;
  });
  var ks = Object.keys(parMois);
  if(!ks.length) return 0;
  var t = 0;
  ks.forEach(function(k){ t += parMois[k]; });
  return t / ks.length;
}

  if(stage === 0){
    s += '<ellipse cx="36" cy="64" rx="5" ry="4" fill="color-mix(in srgb,var(--or) 70%,var(--ink-3))"/>';
  } else {
    var h = [0, 20, 32, 42, 50][stage];
    s += '<path d="M36 66 V'+(66-h)+'" stroke="'+g+'" stroke-width="3" stroke-linecap="round" fill="none"/>';
    if(stage >= 1) s += '<path d="M36 '+(66-h*0.45)+' C 26 '+(66-h*0.45-3)+', 20 '+(66-h*0.45-10)+', 19 '+(66-h*0.45-13)+' C 27 '+(66-h*0.45-13)+', 33 '+(66-h*0.45-8)+', 36 '+(66-h*0.45)+' Z" fill="'+g+'"/>';
    if(stage >= 2) s += '<path d="M36 '+(66-h*0.72)+' C 46 '+(66-h*0.72-3)+', 52 '+(66-h*0.72-10)+', 53 '+(66-h*0.72-13)+' C 45 '+(66-h*0.72-13)+', 39 '+(66-h*0.72-8)+', 36 '+(66-h*0.72)+' Z" fill="'+gl+'"/>';
    if(stage >= 3) s += '<path d="M36 '+(66-h*0.93)+' C 28 '+(66-h*0.93-3)+', 24 '+(66-h*0.93-9)+', 23 '+(66-h*0.93-12)+' C 30 '+(66-h*0.93-12)+', 34 '+(66-h*0.93-7)+', 36 '+(66-h*0.93)+' Z" fill="'+g+'"/>';
    if(stage >= 4){
      var cy = 66-h-4;
      for(var i=0;i<6;i++){
        var a = i*Math.PI/3;
        s += '<ellipse cx="'+(36+Math.cos(a)*7).toFixed(1)+'" cy="'+(cy+Math.sin(a)*7).toFixed(1)+

      }
      s += '<circle cx="36" cy="'+cy+'" r="4.2" fill="color-mix(in srgb,var(--or) 80%,#fff)"/>';

}

         '</div>';
  }

    var montant = b[g], cible = state.cibles[g];
    var cibleEur = b.revenu * cible / 100;

    var col = GROUPS[g].color;

  }

  return h;

  var s = '<button class="tx" style="border-left-color:'+col+'" data-act="txopen" data-id="'+t.id+'">'+

function renderHisto(){

      '<p>Les dépenses que tu notes apparaîtront ici, jour par jour.</p></div>';

  var h = "", cur = null;

           '<span class="g-dot" style="background:'+GROUPS[g].color+'"></span>'+
           '<span style="font-weight:600">'+GROUPS[g].nom+'</span>'+

/* ============================================================
   Écran détail de l'épargne
   ============================================================ */
var epMode = "mois";
var epAnnee = null;   // annee affichee en vue annuelle

function openEpargne(){ epMode = "mois"; epAnnee = +curMK.slice(0,4); renderEpargne(); }
function closeEpargne(){
  var s = document.getElementById("epsheet");
  if(s) s.remove();
}
/* Ligne secondaire d'une poche : le cumul quand il apporte une info de plus que
   la période affichée, sinon le rythme mensuel réellement observé. */
function sousTitrePoche(x, p, mode){
  var bouts = [];
  if(mode === "annee" && x.v > 0){
    var mois = {};
    state.tx.forEach(function(t){
      if(t.type === "revenu" || t.cat !== x.c.id) return;
      var mk = monthKey(t.date);
      if(mk >= p.de && mk <= p.a) mois[mk] = 1;
    });
    var n = Object.keys(mois).length || 1;
    bouts.push("≈ "+eur(x.v / n)+" par mois");
  }
  if(x.cum > x.v) bouts.push(eur(x.cum)+" au total");
  if(x.c.solde > 0) bouts.push("dont "+eur(x.c.solde)+" d'avant l'app");
  if(!bouts.length && x.v > 0) bouts.push("premier versement");
  if(!bouts.length) bouts.push("rien versé sur la période");
  if(x.c.ech) bouts.push("échéance "+mkLabel(x.c.ech));
  return bouts.join(" · ");
}

function renderEpargne(){
  var el = document.getElementById("epsheet");
  if(!el){
    el = document.createElement("div");
    el.id = "epsheet"; el.className = "sheet";
    el.setAttribute("role","dialog"); el.setAttribute("aria-modal","true");
    el.setAttribute("aria-label","Détail de ton épargne");
    document.body.appendChild(el);
  }

  var p = periode(epMode);
  var pots = poches();
  var vals = pots.map(function(c,i){ return {c:c, i:i, v:sommePoche(c.id, p), cum:cumulPoche(c.id)}; });
  var tot = vals.reduce(function(a,x){ return a + x.v; }, 0);
  var cumTot = vals.reduce(function(a,x){ return a + x.cum; }, 0);
  var nMois = moisAvecDonnees(p);

  var titrePeriode = epMode === "mois" ? "Mis de côté en "+mkLabel(curMK)
                                      : "Mis de côté en "+p.an;

  var b = bornesAnnees();
  var h = '<div class="sheet-h"><h2>Ton épargne</h2>'+
    '<button class="close" data-act="epclose" aria-label="Fermer">×</button></div>'+
    '<div class="sheet-b">'+
    '<div class="periodsel">'+
      '<button data-act="epmode" data-v="mois" aria-pressed="'+(epMode==="mois")+'">'+mkLabel(curMK).split(" ")[0]+'</button>'+
      '<button data-act="epmode" data-v="annee" aria-pressed="'+(epMode==="annee")+'">Année</button>'+
    '</div>';
  if(epMode === "annee"){
    h += '<div class="anneesel">'+
      '<button data-act="epan" data-v="-1" aria-label="Année précédente"'+(+p.an <= b.min ? " disabled" : "")+'>‹</button>'+
      '<span class="num">'+p.an+'</span>'+
      '<button data-act="epan" data-v="1" aria-label="Année suivante"'+(+p.an >= b.max ? " disabled" : "")+'>›</button>'+
      '</div>';
  }

  h += '<div class="card"><div class="eyebrow">'+esc(titrePeriode)+'</div>'+
       '<div style="font-family:var(--disp);font-weight:800;font-size:34px;letter-spacing:-.03em;margin:7px 0 2px" class="num">'+eur(tot)+'</div>';
  var sous = [];
  if(epMode === "annee") sous.push(nMois+" mois avec des saisies");
  if(cumTot > tot) sous.push(eur(cumTot)+" au total aujourd'hui");
  if(sous.length) h += '<p class="note" style="margin-top:6px">'+esc(sous.join(" · "))+'.</p>';
  if(tot > 0){
    h += '<div class="epbar" style="margin-top:14px" role="img" aria-label="Répartition entre tes poches">'+
      vals.filter(function(x){ return x.v>0; }).map(function(x){
        return '<i style="width:'+(x.v/tot*100).toFixed(2)+'%;background:'+potColor(x.i,pots.length)+'"></i>';
      }).join("")+'</div>';
  }
  h += '</div>';

  /* mise en garde honnête quand l'échantillon est trop maigre */
  if(epMode === "annee" && nMois > 0 && nMois < 3){
    h += '<div class="hintbox" style="margin-top:14px"><b>Attention à la lecture.</b> '+
      'Cette répartition ne porte que sur '+nMois+' mois. Elle décrit ce que tu as fait, '+
      'pas encore une habitude.</div>';
  }

  h += '<h2 class="sec" style="margin-top:20px">Tes poches</h2><div class="card" style="margin-top:10px">';
  if(!pots.length){
    h += '<p class="note">Aucune poche d\'épargne. Crée-en une pour commencer à répartir.</p>';
  }
  vals.forEach(function(x){
    var pct = tot > 0 ? Math.round(x.v/tot*100) : 0;
    h += '<div class="pot" style="align-items:flex-start">'+
      '<span class="sw" style="background:'+potColor(x.i,pots.length)+';margin-top:5px"></span>'+
      '<span class="em">'+x.c.em+'</span>'+
      '<span class="m"><b>'+esc(x.c.nom)+'</b>'+
      '<span>'+esc(sousTitrePoche(x, p, epMode))+'</span></span>'+
      '<span class="a"><b>'+eur(x.v)+'</b><span>'+(tot>0 ? pct+' %' : '—')+'</span></span>'+
      '</div>';

    if(x.c.obj > 0){
      var r = Math.min(x.cum / x.c.obj, 1);
      var plein = x.cum >= x.c.obj;
      h += '<div class="goal"><div class="gt"><i style="width:'+(r*100).toFixed(1)+'%;background:'+
        (plein ? "var(--brand)" : potColor(x.i,pots.length))+'"></i></div>'+
        '<div class="gl"><b>'+Math.round(r*100)+' %</b> de '+eur(x.c.obj)+
        '<span class="r">'+(plein ? '<span class="full">objectif atteint</span>'
                                  : 'il reste '+eur(x.c.obj - x.cum))+'</span></div></div>';
      if(plein){
        h += '<div class="hintbox" style="margin-top:10px">Cette poche est pleine. '+
          'Tout ce que tu continues d\'y verser ne travaille plus pour toi — '+
          'bascule le versement vers une autre poche.</div>';
      }
    }
    h += '<div class="potbtns">'+
      '<button data-act="epobj" data-id="'+x.c.id+'">Modifier cette poche</button>'+
      '</div>';
  });
  h += '</div>';

  h += '<div class="row" style="margin-top:14px"><button class="btn ghost tiny" data-act="potadd">+ Nouvelle poche</button></div>';
  if(!pots.some(function(c){ return c.solde > 0; })){
    h += '<div class="hintbox" style="margin-top:14px"><b>Tu épargnais déjà avant ?</b> '+
      'Ouvre « Modifier cette poche » et renseigne ce que tu as déjà de côté sur ton compte. '+
      'Ça s\'ajoute au total et à la progression vers l\'objectif, sans être compté comme une '+
      'épargne du mois en cours.</div>';
  }

  var aUrgence = pots.some(function(c){ return /urgence|s[ée]curit|pr[ée]caution/i.test(c.nom); });
  if(aUrgence) h += '<div class="hintbox" style="margin-top:18px">'+
    '<b>Un rappel sur le fonds d\'urgence.</b> Ce n\'est pas un projet : c\'est une réserve '+
    'à atteindre une fois, puis à laisser tranquille. Le repère courant est 3 à 6 mois de '+
    'tes dépenses essentielles'+
    (moyenneEssentiel() > 0 ? ', soit environ '+eur(moyenneEssentiel()*3)+' à '+eur(moyenneEssentiel()*6)+
      ' d\'après tes saisies' : '')+'. Une fois plein, l\'argent est plus utile ailleurs.</div>';

  h += '</div>';
  el.innerHTML = h;
}

    '<div><div class="k">Avancé</div><div class="v num">'+eur(s.paye)+'</div></div>'+
    '<div><div class="k">Remboursé</div><div class="v num" style="color:var(--brand)">'+eur(s.recu)+'</div></div>'+
    '<div><div class="k">En attente</div><div class="v num" style="color:'+(s.attente>0?"var(--or)":"var(--ink)")+'">'+eur(s.attente)+'</div></div>'+
    '<div><div class="k">Coût réel</div><div class="v num">'+eur(s.charge)+'</div></div>'+
    '</div>';

  if(!liste.length){
    h += '<div class="empty" style="padding-top:48px"><h3>Rien à suivre pour l\'instant</h3>'+
      '<p>En saisissant une dépense, active « À me faire rembourser ». Elle apparaîtra ici '+
      'jusqu\'à ce que l\'argent soit revenu.</p></div></div>';
    el.innerHTML = h;
    return;
  }

  var enAttente = liste.filter(function(x){ return !x.fini; });
  var finis = liste.filter(function(x){ return x.fini; });

  function bloc(x){
    var nom = x.t.note || (x.cat ? x.cat.nom : "Dépense");
    var r = x.paye > 0 ? Math.min(x.recu / x.paye, 1) : 0;
    var b = '<div class="rb">'+
      '<div class="rb-top">'+
        '<span class="em">'+(x.cat ? x.cat.em : "•")+'</span>'+
        '<span class="nm">'+esc(nom)+'</span>'+
        '<span class="pv num">'+eur2(x.paye)+'</span>'+
      '</div>'+
      '<div class="rb-sub">'+esc(dateCourte(x.t.date))+(x.cat ? ' · '+esc(x.cat.nom) : '')+'</div>'+
      '<div class="rb-bar"><i style="width:'+(r*100).toFixed(1)+'%"></i></div>'+
      '<div class="rb-line"><b>'+eur2(x.recu)+'</b> remboursé'+
      '<span class="r">'+(x.fini ? '<span class="full">soldé</span>'
                                 : 'reste '+eur2(x.reste)+' à recevoir')+'</span></div>';
    if(x.lignes.length){
      b += '<div class="rb-sub" style="margin-top:6px">'+
        x.lignes.map(function(r2){ return "+"+eur2(-r2.montant)+" le "+dateCourte(r2.date); }).join(" · ")+
        '</div>';
    }
    if(!x.fini){
      b += '<div class="rb-act">'+
        '<button data-act="rbadd" data-id="'+x.t.id+'">Noter un remboursement</button>'+
        '</div>';
    }
    b += '</div>';
    return b;
  }

  if(enAttente.length){
    h += '<h2 class="sec" style="margin-top:22px">En attente ('+enAttente.length+')</h2>'+
      '<div class="card" style="margin-top:10px">'+enAttente.map(bloc).join("")+'</div>';
  }
  if(finis.length){
    h += '<h2 class="sec" style="margin-top:22px">Soldées ('+finis.length+')</h2>'+
      '<div class="card" style="margin-top:10px">'+finis.map(bloc).join("")+'</div>';
  }

  h += '<div class="hintbox" style="margin-top:18px">'+
    '<b>Comment c\'est compté.</b> La dépense reste comptée en entier le mois où tu l\'as payée — '+
    'l\'argent est bien sorti. Chaque remboursement vient en déduction de la même catégorie, '+
    'au mois où il arrive. Il n\'est pas traité comme un revenu, donc tes repères 50/30/20 '+
    'ne bougent pas.</div>';

  h += '</div>';
  el.innerHTML = h;
}

/* ============================================================
   Onboarding
   ============================================================ */
var obStep = 0;
var obDraft = { revenu:"", recur:[], cibles:{essentiel:50,plaisir:30,epargne:20} };

function renderOnboarding(){
  var h = '<div class="ob"><div class="ob-b">';
  if(obStep === 0){
    h += leafSVG().replace('class="leafmark"','style="width:44px;height:44px;margin-bottom:18px"')+
      '<h1>Ton budget, en un coup d\'œil.</h1>'+
      '<p class="lead">Tu notes tes dépenses comme dans ton tableau. Menthe s\'occupe de te montrer, en temps réel, ce qui part en essentiel, en plaisir et en épargne.</p>'+
      '<p class="note" style="max-width:32ch">Trois questions rapides, et c\'est prêt. Tout reste sur ce téléphone.</p>';
  }
  if(obStep === 1){
    h += '<h1>Combien tu gagnes par mois ?</h1>'+
      '<p class="lead">Ton salaire net, celui qui arrive vraiment sur le compte. Tu pourras le corriger mois par mois.</p>'+
      '<div class="field"><label for="ob-rev">Revenu net mensuel</label>'+
      '<input class="inp num" id="ob-rev" type="number" inputmode="decimal" placeholder="0" value="'+obDraft.revenu+'" style="font-size:26px;padding:16px" data-act="obrev"></div>';
  }
  if(obStep === 2){
    h += '<h1>Tes dépenses fixes.</h1>'+
      '<p class="lead">Celles qui tombent tous les mois. Laisse vide ce qui ne te concerne pas — tu pourras en ajouter plus tard.</p>'+
      '<div class="card stack">';
    [["Loyer / charges","🏠"],["Énergie","💡"],["Téléphone / Internet","📱"],["Assurances","🛡️"],["Abonnements","🎧"]].forEach(function(p,i){
      var val = obDraft.recur[i] != null ? obDraft.recur[i] : "";
      h += '<div class="rec-row"><span class="em">'+p[1]+'</span><span class="nm">'+p[0]+'</span>'+
        '<input type="number" inputmode="decimal" id="obr-'+i+'" value="'+val+'" placeholder="—" data-act="obrec" data-i="'+i+'" aria-label="'+p[0]+'"></div>';
    });
    h += '</div>';
  }
  if(obStep === 3){
    var s = obDraft.cibles, tot = s.essentiel+s.plaisir+s.epargne;
    var rev = parseFloat(obDraft.revenu) || 0;
    h += '<h1>Ton repère.</h1>'+
      '<p class="lead">La règle 50/30/20 répartit le revenu entre l\'essentiel, le plaisir et l\'épargne. C\'est un point de départ, pas un jugement — ajuste si ça ne colle pas à ta vie.</p>'+
      '<div class="card stack"><div class="split">'+
      GORDER.map(function(g){
        return '<div class="field"><label for="ob-'+g+'" style="color:'+GROUPS[g].color+'">'+GROUPS[g].nom+'</label>'+
          '<input class="inp num" type="number" inputmode="numeric" id="ob-'+g+'" value="'+s[g]+'" data-act="obcible" data-g="'+g+'"></div>';
      }).join("")+'</div>'+
      (rev>0 ? '<p class="note">Sur '+eur(rev)+', ça fait '+
        GORDER.map(function(g){ return eur(rev*s[g]/100)+" en "+GROUPS[g].nom.toLowerCase(); }).join(", ")+'.</p>' : '')+
      (tot!==100 ? '<p class="note" style="color:var(--or);font-weight:600">Total : '+tot+' %. Il faudrait arriver à 100 %.</p>' : '')+
      '</div>';
  }
  h += '</div><div class="ob-f">'+
    '<div class="dots">'+[0,1,2,3].map(function(i){ return '<i class="'+(i===obStep?"on":"")+'"></i>'; }).join("")+'</div>'+
    '<button class="btn" data-act="obnext">'+(obStep===3 ? "C\'est parti" : "Continuer")+'</button>'+
    (obStep>0 ? '<button class="skiplink" data-act="obback">Retour</button>'
              : '<button class="skiplink" data-act="obskip">Passer la configuration</button>')+
    '</div></div>';
  return h;
}

function finishOnboarding(){
  state.revenu = parseFloat(obDraft.revenu) || 0;
  state.cibles = {
    essentiel: +obDraft.cibles.essentiel || 50,
    plaisir:   +obDraft.cibles.plaisir   || 30,
    epargne:   +obDraft.cibles.epargne   || 20
  };
  var map = [["Loyer / charges","Loyer"],["Énergie","Énergie"],["Téléphone / Internet","Téléphone / Internet"],
             ["Assurances","Assurances"],["Abonnements","Abonnements"]];
  obDraft.recur.forEach(function(v,i){
    var m = parseFloat(v);
    if(!m || m<=0) return;
    var target = map[i][1];
    var c = state.cats.filter(function(x){ return x.nom===target; })[0];
    if(!c){
      c = {id:uid(), nom:target, em:"📌", gr: i===4 ? "plaisir" : "essentiel"};
      state.cats.push(c);
    }
    state.recur.push({id:uid(), nom:map[i][0], montant:m, cat:c.id});
  });
  state.onboarded = true;
  save();
  render();
}

/* ============================================================
   Shell
   ============================================================ */
function render(){
  var root = document.getElementById("root");
  if(!state.onboarded){ root.innerHTML = renderOnboarding(); return; }

  var body = view === "accueil" ? renderAccueil()
           : view === "histo"   ? renderHisto()
           : renderReglages();

  var isCur = curMK === curMonthKey();
  root.innerHTML =
    '<div class="app">'+
      '<div class="top">'+
        '<div class="brandmark">'+leafSVG()+'<b>Menthe</b></div>'+
        '<div class="mnav">'+
          '<button data-act="mprev" aria-label="Mois précédent">‹</button>'+
          '<span class="lbl">'+mkLabel(curMK)+'</span>'+
          '<button data-act="mnext" aria-label="Mois suivant"'+(isCur?" disabled":"")+'>›</button>'+
        '</div>'+
      '</div>'+
      '<div class="scroll">'+body+'</div>'+
      '<nav class="nav">'+
        ['accueil','histo','regl'].map(function(k,i){
          var lbl = ["Accueil","Historique","Réglages"][i];
          return '<button data-act="view" data-v="'+k+'"'+(view===k?' aria-current="page"':'')+'>'+
            navIcon(k)+'<span>'+lbl+'</span></button>';
        }).join("")+
      '</nav>'+
    '</div>'+
    '<button class="fab" data-act="open" aria-label="Ajouter une saisie">+</button>';
}

/* ============================================================
   Événements
   ============================================================ */
document.addEventListener("click", function(ev){
  var el = ev.target.closest ? ev.target.closest("[data-act]") : null;
  if(!el) return;
  var a = el.getAttribute("data-act");

  /* onboarding */
  if(a === "obnext"){
    if(obStep < 3){ obStep++; render(); }
    else finishOnboarding();
    return;
  }
  if(a === "obback"){ obStep--; render(); return; }
  if(a === "obskip"){ state.onboarded = true; save(); render(); return; }

  /* navigation */
  if(a === "view"){ view = el.getAttribute("data-v"); openTx = null; render(); window.scrollTo(0,0); return; }
  if(a === "mprev"){ curMK = shiftMonth(curMK,-1); openTx=null; render(); return; }
  if(a === "mnext"){ curMK = shiftMonth(curMK, 1); openTx=null; render(); return; }

  /* saisie */
  if(a === "open"){ openSaisie(); return; }
  if(a === "sclose"){ closeSaisie(); return; }
  if(a === "stype"){ draft.type = el.getAttribute("data-v"); renderSheet(); return; }
  if(a === "scat"){ draft.cat = el.getAttribute("data-id"); renderSheet(); return; }
  if(a === "srecur"){ draft.recur = !draft.recur; renderSheet(); return; }
  if(a === "srb"){ draft.rb = !draft.rb; renderSheet(); return; }
  if(a === "key"){
    var k = el.getAttribute("data-k");
    if(k === "del") draft.amount = draft.amount.slice(0,-1);
    else if(k === ","){ if(draft.amount.indexOf(",") === -1 && draft.amount !== "") draft.amount += ","; }
    else {
      var p = draft.amount.split(",");
      if(p.length === 2 && p[1].length >= 2) return;
      if(draft.amount.replace(",","").length >= 8) return;
      draft.amount += k;
    }
    renderSheet();
    return;
  }
  if(a === "sadd"){
    var v = draftValue();
    if(v <= 0) return;
    var t = { id:uid(), ts:Date.now(), date:draft.date, montant:v,
              type:draft.type, cat:draft.type==="revenu"?null:draft.cat, note:draft.note.trim() };
    if(draft.rb && draft.type === "depense") t.rb = true;
    state.tx.push(t);
    if(draft.recur && draft.type === "depense"){
      var c0 = catById(draft.cat);
      state.recur.push({ id:uid(), nom: draft.note.trim() || (c0?c0.nom:"Poste fixe"),
                         montant:v, cat:draft.cat });
    }
    save();
    curMK = monthKey(draft.date);
    closeSaisie();
    render();
    toast("Noté · "+eur2(v));
    return;
  }

  /* transactions */
  if(a === "txopen"){ var id = el.getAttribute("data-id"); openTx = (openTx===id?null:id); render(); return; }
  if(a === "txclose"){ openTx = null; render(); return; }
  if(a === "txdel"){
    var did = el.getAttribute("data-id");
    state.tx = state.tx.filter(function(t){ return t.id !== did && t.rbDe !== did; });
    openTx = null; save(); render();
    if(document.getElementById("rbsheet")) renderRemb();
    toast("Ligne supprimée");
    return;
  }

  /* récurrents — écran d'accueil */
  if(a === "rectog"){
    var rid = el.getAttribute("data-id");
    state.recur.forEach(function(r){ if(r.id===rid) r.off = !r.off; });
    render(); return;
  }
  if(a === "recgo"){
    var n = 0, tot = 0;
    state.recur.forEach(function(r){
      if(r.off) return;
      var f = document.getElementById("recamt-"+r.id);
      var m = f ? parseFloat(f.value) : r.montant;
      if(!m || m <= 0) return;
      r.montant = m;
      var day = Math.min(1, daysInMonth(curMK));
      state.tx.push({ id:uid(), ts:Date.now(), date:curMK+"-"+pad2(day),
                      montant:m, type:"depense", cat:r.cat, note:r.nom });
      n++; tot += m;
    });
    state.recurFait[curMK] = true;
    state.recur.forEach(function(r){ delete r.off; });
    save(); render();
    toast(n ? n+" poste"+(n>1?"s":"")+" ajouté"+(n>1?"s":"")+" · "+eur(tot) : "Aucun poste ajouté");
    return;
  }
  if(a === "recskip"){ state.recurFait[curMK] = true; save(); render(); return; }

  /* réglages */
  if(a === "cible502030"){ state.cibles = {essentiel:50,plaisir:30,epargne:20}; save(); render(); return; }
  if(a === "recdel"){
    var rr = el.getAttribute("data-id");
    state.recur = state.recur.filter(function(r){ return r.id !== rr; });
    save(); render(); return;
  }
  if(a === "recadd"){
    openModal({
      title:"Un poste fixe",
      intro:"Il te sera reproposé au début de chaque mois, jamais ajouté tout seul.",
      kind:"recadd", submit:"Ajouter",
      fields:[
        {key:"nom", label:"Nom", type:"text", value:"", placeholder:"Loyer, mutuelle…"},
        {key:"montant", label:"Montant habituel (€)", type:"number", value:""},
        {key:"cat", label:"Catégorie", type:"select", value:state.cats[0] && state.cats[0].id,
         options: state.cats.map(function(c){ return {v:c.id, l:c.em+"  "+c.nom+"  ("+GROUPS[c.gr].nom+")"}; })}
      ]
    });
    return;
  }
  if(a === "catadd"){
    openModal({
      title:"Une nouvelle catégorie",
      kind:"catadd", submit:"Créer",
      fields:[
        {key:"nom", label:"Nom", type:"text", value:"", placeholder:"Coiffeur, vétérinaire…"},
        {key:"em", label:"Emoji", type:"text", value:"✨"},
        {key:"gr", label:"Dans quel groupe ?", type:"select", value:"essentiel",
         options: GORDER.map(function(g){ return {v:g, l:GROUPS[g].nom+" — "+GROUPS[g].desc}; })}
      ]
    });
    return;
  }
  /* épargne */
  if(a === "rbopen"){ openRemb(); return; }
  if(a === "rbclose"){ closeRemb(); return; }
  if(a === "rbadd"){
    var av = null, aid = el.getAttribute("data-id");
    avances().forEach(function(x){ if(x.t.id === aid) av = x; });
    if(!av) return;
    openModal({
      title:"Remboursement reçu",
      intro:(av.t.note || (av.cat?av.cat.nom:"Dépense"))+" — "+eur2(av.paye)+" avancés, "+
            eur2(av.reste)+" encore attendus.",
      kind:"remb", avanceId:aid, submit:"Enregistrer",
      fields:[
        {key:"m", label:"Montant reçu (€)", type:"number", value: Math.round(av.reste*100)/100},
        {key:"d", label:"Date de réception", type:"date", value: todayISO()}
      ]
    });
    return;
  }
  if(a === "epopen"){ openEpargne(); return; }
  if(a === "epclose"){ closeEpargne(); return; }
  if(a === "epmode"){
    epMode = el.getAttribute("data-v");
    if(epMode === "annee" && !epAnnee) epAnnee = +curMK.slice(0,4);
    renderEpargne(); return;
  }
  if(a === "epan"){
    var bb = bornesAnnees();
    epAnnee = Math.min(bb.max, Math.max(bb.min, (epAnnee || +curMK.slice(0,4)) + (+el.getAttribute("data-v"))));
    renderEpargne(); return;
  }
  if(a === "epobj"){
    var pc = catById(el.getAttribute("data-id"));
    if(!pc) return;
    var moy = moyenneEssentiel();
    var urgence = /urgence|s[ée]curit|pr[ée]caution/i.test(pc.nom);
    openModal({
      title:pc.em+"  "+pc.nom,
      intro: urgence && moy > 0
        ? "Repère courant pour une réserve d'urgence : 3 à 6 mois de dépenses essentielles, soit "+eur(moy*3)+" à "+eur(moy*6)+" d'après tes saisies."
        : "Tous les champs sont facultatifs. Laisse vide ce qui ne te sert pas.",
      kind:"poche", potId:pc.id, submit:"Enregistrer",
      extra: pc.obj > 0 ? {act:"epobjdel", id:pc.id, label:"Retirer l'objectif de cette poche"} : null,
      fields:[
        {key:"solde", label:"Déjà épargné avant l'app (€)", type:"number", value: pc.solde || ""},
        {key:"obj", label:"Montant à atteindre (€)", type:"number",
         value: pc.obj || (urgence && moy > 0 ? Math.round(moy*4) : "")},
        {key:"ech", label:"Échéance (facultatif)", type:"month", value: pc.ech || ""}
      ]
    });
    return;
  }
  if(a === "epobjdel"){
    var pd = catById(el.getAttribute("data-id"));
    if(pd){ delete pd.obj; delete pd.ech; save(); }
    closeModal(); render();
    if(document.getElementById("epsheet")) renderEpargne();
    return;
  }
  if(a === "potadd"){
    openModal({
      title:"Une nouvelle poche d'épargne",
      intro:"Elle reste dans le groupe Épargne. L'objectif se règle ensuite, si tu en veux un.",
      kind:"potadd", submit:"Créer",
      fields:[
        {key:"nom", label:"Nom", type:"text", value:"", placeholder:"Voiture, mariage, études…"},
        {key:"em", label:"Emoji", type:"text", value:"🎯"}
      ]
    });
    return;
  }

  if(a === "mcancel"){ closeModal(); return; }
  if(a === "mok"){
    var mv = modalValues(), kind = modal.kind;
    if(kind === "recadd"){
      var rm = parseFloat(String(mv.montant).replace(",","."));
      if(!mv.nom.trim() || !rm || rm <= 0){ toast("Il manque le nom ou le montant"); return; }
      state.recur.push({id:uid(), nom:mv.nom.trim(), montant:rm, cat:mv.cat});
    }
    if(kind === "catadd"){
      if(!mv.nom.trim()){ toast("Il manque le nom"); return; }
      state.cats.push({id:uid(), nom:mv.nom.trim(), em:(mv.em||"✨").slice(0,4), gr:mv.gr});
    }
    if(kind === "revenu"){
      var rv = parseFloat(String(mv.v).replace(",","."));
      if(isNaN(rv) || rv < 0){ toast("Montant invalide"); return; }
      state.revenuMois[curMK] = rv;
    }
    if(kind === "poche"){
      var oc = catById(modal.potId);
      if(!oc) { closeModal(); return; }
      var ov = parseFloat(String(mv.obj).replace(",","."));
      var sv = parseFloat(String(mv.solde).replace(",","."));
      if(mv.obj !== "" && (isNaN(ov) || ov < 0)){ toast("Objectif : montant invalide"); return; }
      if(mv.solde !== "" && (isNaN(sv) || sv < 0)){ toast("Solde de départ : montant invalide"); return; }
      if(mv.solde !== "" && sv > 0) oc.solde = sv; else delete oc.solde;
      if(mv.obj !== "" && ov > 0) oc.obj = ov; else delete oc.obj;
      if(mv.ech) oc.ech = mv.ech; else delete oc.ech;
    }
    if(kind === "remb"){
      var src = null;
      state.tx.forEach(function(t){ if(t.id === modal.avanceId) src = t; });
      var rm = parseFloat(String(mv.m).replace(",","."));
      if(!src || !rm || rm <= 0){ toast("Entre un montant reçu"); return; }
      state.tx.push({ id:uid(), ts:Date.now(), date: mv.d || todayISO(),
                      montant: -rm, type:"depense", cat: src.cat,
                      note: "Remboursement — "+(src.note || ""), rbDe: src.id });
    }
    if(kind === "potadd"){
      if(!mv.nom.trim()){ toast("Il manque le nom"); return; }
      state.cats.push({id:uid(), nom:mv.nom.trim(), em:(mv.em||"🎯").slice(0,4), gr:"epargne"});
    }
    closeModal(); save(); render();
    if(document.getElementById("epsheet")) renderEpargne();
    if(document.getElementById("rbsheet")) renderRemb();
    return;
  }
  if(a === "catdel"){
    var cid = el.getAttribute("data-id");
    var used = state.tx.filter(function(t){ return t.cat===cid; }).length;
    if(used){ toast(used+" saisie"+(used>1?"s":"")+" utilise"+(used>1?"nt":"")+" cette catégorie"); return; }
    state.cats = state.cats.filter(function(c){ return c.id !== cid; });
    state.recur = state.recur.filter(function(r){ return r.cat !== cid; });
    save(); render(); return;
  }
  if(a === "copy"){
    var ta = document.getElementById("bk-out");
    ta.select(); ta.setSelectionRange(0, 999999);
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).then(
        function(){ toast("Sauvegarde copiée"); },
        function(){ toast("Sélectionne le texte et copie-le"); });
    } else {
      try{ document.execCommand("copy"); toast("Sauvegarde copiée"); }
      catch(e){ toast("Sélectionne le texte et copie-le"); }
    }
    return;
  }
  if(a === "dl"){
    try{
      var blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
      var url = URL.createObjectURL(blob);
      var link = document.createElement("a");
      link.href = url; link.download = "menthe-"+todayISO()+".json";
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
      toast("Si rien ne se passe, utilise « Copier »");
    }catch(e){ toast("Téléchargement bloqué ici — utilise « Copier »"); }
    return;
  }
  if(a === "restore"){
    var src = document.getElementById("bk-in").value.trim();
    if(!src) return;
    try{
      var o = JSON.parse(src);
      if(!o || !Array.isArray(o.tx)) throw new Error("format");
      var f = freshState();
      for(var kk in f) if(!(kk in o)) o[kk] = f[kk];
      state = o; save(); view = "accueil"; render();
      toast("Sauvegarde restaurée");
    }catch(e){ toast("Ce texte n'est pas une sauvegarde valide"); }
    return;
  }
  if(a === "wipe"){
    if(el.dataset.armed === "1"){
      state = freshState(); obStep = 0; obDraft = {revenu:"",recur:[],cibles:{essentiel:50,plaisir:30,epargne:20}};
      save(); view = "accueil"; render(); return;
    }
    el.dataset.armed = "1";
    el.textContent = "Appuie encore pour tout effacer";
    setTimeout(function(){ if(el.isConnected){ el.dataset.armed="0"; el.textContent="Tout effacer et recommencer"; } }, 4000);
    return;
  }
  if(a === "revenu"){
    openModal({
      title:"Revenu de "+mkLabel(curMK),
      intro:"Ne change que ce mois-ci. Ton revenu habituel reste réglé dans Réglages.",
      kind:"revenu", submit:"Enregistrer",
      fields:[{key:"v", label:"Revenu net du mois (€)", type:"number", value:revenuDe(curMK) || ""}]
    });
    return;
  }
});

document.addEventListener("click", function(ev){
  if(ev.target && ev.target.id === "scrim") closeModal();
});

document.addEventListener("input", function(ev){
  var el = ev.target.closest ? ev.target.closest("[data-act]") : null;
  if(!el) return;
  var a = el.getAttribute("data-act");
  if(a === "snote"){ draft.note = el.value; return; }
  if(a === "sdate"){ if(el.value) draft.date = el.value; return; }
  if(a === "obrev"){ obDraft.revenu = el.value; return; }
  if(a === "obrec"){ obDraft.recur[+el.getAttribute("data-i")] = el.value; return; }
  if(a === "obcible"){ obDraft.cibles[el.getAttribute("data-g")] = el.value === "" ? 0 : +el.value; return; }
  if(a === "setrev"){ state.revenu = parseFloat(el.value) || 0; save(); return; }
  if(a === "setjd"){
    var jd = parseInt(el.value, 10);
    if(isNaN(jd)) return;
    state.jourDebut = Math.min(28, Math.max(1, jd));
    curMK = curMonthKey();
    save();
    clearTimeout(el._t);
    el._t = setTimeout(function(){ render(); }, 900);
    return;
  }
  if(a === "setcible"){
    state.cibles[el.getAttribute("data-g")] = el.value === "" ? 0 : +el.value;
    save(); return;
  }
  if(a === "recamt"){ return; }
});

document.addEventListener("keydown", function(ev){
  if(ev.key !== "Escape") return;
  if(document.getElementById("scrim")) closeModal();
  else if(document.getElementById("sheet")) closeSaisie();
  else if(document.getElementById("rbsheet")) closeRemb();
  else if(document.getElementById("epsheet")) closeEpargne();
});

/* iOS : plein écran + icône quand on ajoute à l'écran d'accueil */
(function(){
  function meta(n,c){ var m=document.createElement("meta"); m.name=n; m.content=c; document.head.appendChild(m); }
  meta("apple-mobile-web-app-capable","yes");
  meta("mobile-web-app-capable","yes");
  meta("apple-mobile-web-app-status-bar-style","default");
  meta("apple-mobile-web-app-title","Menthe");
  meta("theme-color","#F4F7F2");
})();

state = load();
render();

})();
</script>

</body>
